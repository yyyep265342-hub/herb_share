<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#43291b"><title>智能换字 · 进度与匹配</title><style>
:root{--bg:#f5efe2;--paper:#fffaf0;--ink:#39291e;--muted:#827264;--red:#963f33;--green:#397154;--gold:#bd8a32;--line:#dfd0b9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 100% 0,#ead9b8,transparent 34%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.app{width:min(800px,100%);margin:auto;padding:18px 14px 70px}a{color:var(--green);font-weight:700;text-decoration:none}.hero{margin:15px 0;padding:24px;border-radius:22px;background:linear-gradient(135deg,#43291b,#8d4332);color:#fff}.hero small,.hero p,.deadline{color:#ebdac8}.hero h1{margin:5px 0;font:700 30px Georgia,"Songti SC",serif}.phrase{display:flex;gap:5px;flex-wrap:wrap;margin-top:14px}.phrase i{display:grid;place-items:center;width:32px;height:38px;border-radius:8px;background:#fff4d8;color:#7f3029;font-style:normal;font-weight:900}.deadline{margin-top:12px;font-size:12px}.profiles,.toolbar{display:flex;gap:8px;overflow:auto;margin:12px 0}.profiles button,.toolbar button,.actions button{white-space:nowrap;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 14px;color:var(--ink)}.profiles button.active{border-color:var(--red);background:var(--red);color:#fff}.toolbar .publish,.actions .primary{border-color:var(--red);background:var(--red);color:#fff;font-weight:800}.toolbar input{flex:1;min-width:140px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:14px}.panel,.post{margin-top:12px;padding:16px;border:1px solid var(--line);border-radius:16px;background:rgba(255,250,240,.96)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.summary div{text-align:center;padding:12px 5px;border-radius:12px;background:#fff}.summary b,.summary small{display:block}.summary b{font-size:25px}.summary small{color:var(--muted)}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.head h2,.head h3{margin:0}.head .links{color:var(--red);font-size:12px}.head .links span{margin-left:10px;cursor:pointer}.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:13px 0}.fields input{min-width:0;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px}.word-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:12px}.word{padding:7px 3px;border:2px solid var(--line);border-radius:10px;background:#fff;text-align:center}.word.missing{border-color:#d98c83;background:#fff0ed}.word.surplus{border-color:#77a78a;background:#edf8f0}.word b{display:block;font-size:20px}.step{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;font-size:12px}.step button{border:0;background:none;color:var(--red);font-size:20px;cursor:pointer}.status{display:grid;gap:7px;margin-top:12px;color:var(--muted);font-size:13px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.chip{display:grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:9px;background:#f1e2c5;color:#73372d;font-size:18px;font-weight:900}.chip.give{background:#e0efe3;color:var(--green)}.actions{display:flex;gap:8px;margin-top:14px}.match-score{padding:4px 9px;border-radius:20px;background:#e0efe3;color:var(--green);font-size:12px}.oneway{background:#eee4d5;color:var(--muted)}.exchange{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;margin:13px 0}.exchange>span{text-align:center;color:var(--gold);font-size:22px}.side small{color:var(--muted)}.remark{color:var(--muted);font-size:12px}.empty{text-align:center;padding:38px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:28px;z-index:30;display:none;transform:translateX(-50%);padding:10px 16px;border-radius:10px;background:#30251e;color:#fff}.toast.show{display:block}@media(max-width:600px){.word-grid{grid-template-columns:repeat(4,1fr)}.fields{grid-template-columns:1fr}.hero{padding:19px}.exchange{grid-template-columns:1fr 25px 1fr}}
.line-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}.line-toggle{display:flex;justify-content:space-between;gap:8px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}.line-toggle small{color:var(--muted)}.line-toggle.done{border-color:#77a78a;background:#edf8f0}.line-toggle.done b{color:var(--green)}</style></head><body><main class="app"><a href="index.html">‹ 返回互助首页</a><section class="hero"><small>五周年 · 智能换字</small><h1>账号进度与互补匹配</h1><p>填写每个字的数量即可。系统展示完整缺字/余字状态，自动优先推荐双向互补玩家，不再拆成一对一需求。</p><div class="phrase" id="phrase"></div><div class="deadline" id="deadline"></div></section><div class="profiles" id="profiles"></div><div class="actions"><button onclick="importProgress()">导入进度</button><button onclick="backupProgress()">备份全部账号</button></div><section class="panel" id="editor"></section><div class="toolbar"><input id="search" placeholder="搜索账号、游戏ID或字"><button id="publish" class="publish">一键发布当前状态</button></div><div id="stats" class="remark"></div><div id="list"></div></main><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="site-common.js?v=20260813-2"></script><script>
const WORDS=[...'哈利波特魔法觉醒五周年送双人扫帚'],LINES=[['r1','横线 1','哈利波特'],['r2','横线 2','魔法觉醒'],['r3','横线 3','五周年送'],['r4','横线 4','双人扫帚'],['c1','竖线 1','哈魔五双'],['c2','竖线 2','利法周人'],['c3','竖线 3','波觉年扫'],['c4','竖线 4','特醒送帚'],['d2','右上→左下','特觉周双']].map(([id,label,text])=>({id,label,text,words:[...text]})),TYPE='anniversary_word',END=Date.parse('2026-09-14T16:00:00Z'),SUPABASE_URL='https://ygslzwiznvcfujonvblq.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ5Z3Nsendpem52Y2Z1am9udmJscSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzgwMDQzODY5LCJleHAiOjIwOTU2MTk4Njl9.J9P1NyK5tiSzPZgDeLpwfS2eRaFrP5Gb4fgpmA258vA',sb=window.supabase?window.supabase.createClient(SUPABASE_URL,KEY):null,STORE='word_trade_profiles_v2';let owner='',localIdentity=false,profiles=[],activeId='',posts=[],timer
const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),empty=()=>Object.fromEntries(WORDS.map(w=>[w,0])),active=()=>Date.now()<END
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function normalize(p={}){return{id:p.id||`${Date.now()}_${Math.random().toString(36).slice(2,7)}`,name:p.name||`账号 ${profiles.length+1}`,nickname:p.nickname||'',gameId:p.gameId||'',server:p.server||'',draws:Math.max(0,+p.draws||0),counts:{...empty(),...(p.counts||{})},redeemedLines:Array.isArray(p.redeemedLines)?p.redeemedLines.filter(id=>LINES.some(x=>x.id===id)):[]}}
function current(){return profiles.find(p=>p.id===activeId)||profiles[0]}
function requiredFor(p){return LINES.filter(line=>!p.redeemedLines.includes(line.id)).reduce((o,line)=>(line.words.forEach(w=>o[w]++),o),empty())}
function state(p){const required=requiredFor(p),total=Object.values(required).reduce((a,b)=>a+b,0),missing=WORDS.filter(w=>p.counts[w]<required[w]),surplus=WORDS.filter(w=>p.counts[w]>required[w]),deficit=missing.reduce((n,w)=>n+required[w]-p.counts[w],0),owned=WORDS.reduce((n,w)=>n+Math.min(p.counts[w],required[w]),0);return{required,total,missing,surplus,deficit,owned,progress:total?Math.round(owned/total*100):100,expected:Math.min(deficit,Math.round(p.draws*missing.length/WORDS.length)),missingText:missing.map(w=>`${w}×${required[w]-p.counts[w]}`).join('、')||'无需换入',surplusText:surplus.map(w=>`${w}×${p.counts[w]-required[w]}`).join('、')||'暂无可安全换出'}}
function save(){localStorage.setItem(STORE,JSON.stringify(profiles));localStorage.setItem(STORE+'_active',activeId)}
function renderProfiles(){$('profiles').innerHTML=profiles.map(p=>`<button class="${p.id===activeId?'active':''}" onclick="switchProfile('${p.id}')">${esc(p.name)}</button>`).join('')+'<button onclick="addProfile()">＋ 添加账号</button>'}
function renderEditor(){const p=current(),s=state(p);$('editor').innerHTML=`<div class="head"><h2>${esc(p.name)}</h2><div class="links"><span onclick="removeProfile()">删除账号</span></div></div><div class="fields"><input value="${esc(p.name)}" data-field="name" placeholder="本地账号备注"><input value="${esc(p.nickname)}" data-field="nickname" placeholder="游戏昵称（必填）"><input value="${esc(p.gameId)}" data-field="gameId" placeholder="游戏ID（必填）"><input value="${esc(p.server)}" data-field="server" placeholder="服务器（必填）"><input value="${p.draws}" data-field="draws" type="number" min="0" placeholder="预计还能抽几次"></div><div class="summary"><div><b>${s.progress}%</b><small>剩余线路 ${s.owned}/${s.total}</small></div><div><b>${s.deficit}</b><small>建议换入张数</small></div><div><b>${s.surplus.length}</b><small>可安全换出</small></div></div>${p.draws?`<p class="remark">按均匀概率粗估，未来 ${p.draws} 抽约可补 ${s.expected} 张有效进度，仅作规划参考。</p>`:''}<p class="remark">已兑换 ${p.redeemedLines.length}/9 条。点击线路标记后，该线每个字的剩余需求自动减 1。</p><div class="line-grid">${LINES.map(line=>`<div class="line-toggle ${p.redeemedLines.includes(line.id)?'done':''}" onclick="toggleLine('${line.id}')"><span><b>${line.label}</b><br><small>${line.text}</small></span><b>${p.redeemedLines.includes(line.id)?'已兑换':'标记兑换'}</b></div>`).join('')}</div><div class="word-grid">${WORDS.map(w=>`<div class="word ${p.counts[w]<s.required[w]?'missing':p.counts[w]>s.required[w]?'surplus':''}"><b>${w}</b><small>剩需${s.required[w]}</small><div class="step"><button onclick="changeCount('${w}',-1)">−</button><span>${p.counts[w]}</span><button onclick="changeCount('${w}',1)">＋</button></div></div>`).join('')}</div><div class="status"><div>建议换入：${s.missingText}</div><div>可安全换出：${s.surplusText}</div></div><div class="actions"><button onclick="copyProgress()">导出/分享进度</button></div>`;$('editor').querySelectorAll('[data-field]').forEach(el=>el.onchange=()=>updateField(el.dataset.field,el.value))}
function parseMissing(v){try{const x=JSON.parse(v);return Array.isArray(x)?x:v?[v]:[]}catch(e){return v?[v]:[]}}
function parseOffers(v){try{const x=JSON.parse(v);return Array.isArray(x)?x.map(o=>typeof o==='string'?{card:o,count:1}:o):[]}catch(e){return[]}}
function score(post,p){const me=state(p),receive=post.surplus.filter(w=>me.missing.includes(w)),give=me.surplus.filter(w=>post.missing.includes(w)),mutual=receive.length>0&&give.length>0;return{receive,give,mutual,score:receive.length*2+give.length}}
function renderList(){const p=current(),kw=$('search').value.trim().toLowerCase();let list=posts.filter(x=>!(window.HW&&HW.isBlocked('trade',x.id))&&(!kw||[x.game_id,x.remark,...x.missing,...x.surplus].some(v=>String(v||'').toLowerCase().includes(kw)))).map(x=>({...x,match:score(x,p)})).sort((a,b)=>Number(b.match.mutual)-Number(a.match.mutual)||b.match.score-a.match.score||b.created_at-a.created_at);$('stats').textContent=`共 ${list.length} 个有效账号 · 已按与“${p.name}”的互补度排序`;$('list').innerHTML=list.length?list.map(x=>`<article class="post"><div class="head"><h3>🪄 ${esc(x.game_id)}</h3><div>${x.match.score?`<span class="match-score ${x.match.mutual?'':'oneway'}">${x.match.mutual?'双向互补':'可单向帮助'} · ${x.match.score}分</span>`:''}<span class="links">${x.isOwn?`<span onclick="completePost('${x.id}')">完成</span><span onclick="removePost('${x.id}')">删除</span>`:`<span onclick="copyId('${esc(x.game_id)}')">复制ID</span><span onclick="reportPost('${x.id}')">举报</span>`}</span></div></div><div class="exchange"><div class="side"><small>他/她缺少</small><div class="chips">${x.missing.map(w=>`<i class="chip">${esc(w)}</i>`).join('')||'已集齐'}</div></div><span>⇄</span><div class="side"><small>他/她多出</small><div class="chips">${x.surplus.map(w=>`<i class="chip give">${esc(w)}</i>`).join('')||'暂无'}</div></div></div>${x.match.receive.length?`<div class="remark">可补给你：${x.match.receive.join('、')}</div>`:''}${x.match.give.length?`<div class="remark">你可补给对方：${x.match.give.join('、')}</div>`:''}${x.remark?`<div class="remark">备注：${esc(x.remark)}</div>`:''}</article>`).join(''):'<div class="empty">暂无换字状态，发布后系统会自动寻找互补玩家</div>'}
async function load(){const{data,error}=await sb.from('trade_posts').select('*').eq('want_rarity',TYPE).is('completed_at',null).order('created_at',{ascending:false}).limit(300);if(error)return toast('加载失败：'+error.message);posts=(data||[]).map(x=>{const missing=parseMissing(x.want_card),offers=parseOffers(x.offer_cards);return{...x,missing,surplus:offers.map(o=>o.card),offers,isOwn:(x.user_id||x.owner_id)===owner}});renderList()}
function updateDeadline(){const d=END-Date.now();$('deadline').textContent=d<=0?'活动已结束，发布入口已关闭':`距离入口关闭还有 ${Math.ceil(d/86400000)} 天 · 2026年9月15日 00:00 关闭`;$('publish').hidden=d<=0}
window.switchProfile=id=>{activeId=id;save();renderProfiles();renderEditor();renderList()};window.addProfile=()=>{const p=normalize();profiles.push(p);activeId=p.id;save();renderProfiles();renderEditor();renderList()};window.removeProfile=()=>{if(profiles.length===1)return toast('至少保留一个账号');if(!confirm('确认删除当前账号及本地进度？'))return;profiles=profiles.filter(p=>p.id!==activeId);activeId=profiles[0].id;save();renderProfiles();renderEditor();renderList()};window.changeCount=(w,d)=>{const p=current();p.counts[w]=Math.max(0,Math.min(99,+p.counts[w]+d));save();renderEditor();renderList()};window.toggleLine=id=>{const p=current();p.redeemedLines=p.redeemedLines.includes(id)?p.redeemedLines.filter(x=>x!==id):[...p.redeemedLines,id];save();renderEditor();renderList()};window.updateField=(field,value)=>{const p=current();p[field]=field==='draws'?Math.max(0,+value||0):value.trim();save();renderProfiles();renderEditor();renderList()}
function progressText(){const p=current(),s=state(p);return`【「字」在必得换字】\n账号：${p.name}${p.gameId?`（游戏ID：${p.gameId}）`:''}\n剩余线路进度：${s.progress}%（${s.owned}/${s.total}张）\n已兑换线路：${p.redeemedLines.length}/9\n建议换入：${s.missingText}\n可安全换出：${s.surplusText}\n寻找状态互补的玩家。`}
window.copyProgress=()=>navigator.clipboard?.writeText(progressText()).then(()=>toast('进度文案已复制'))
window.backupProgress=async()=>{const data=JSON.stringify({version:2,profiles,activeId},null,2);try{await navigator.clipboard.writeText(data);toast('全部账号备份已复制')}catch(e){prompt('复制以下备份数据',data)}}
window.importProgress=()=>{const raw=prompt('粘贴换字进度备份（JSON）');if(!raw)return;try{const parsed=JSON.parse(raw),list=Array.isArray(parsed)?parsed:parsed.profiles;if(!Array.isArray(list)||!list.length)throw new Error('没有账号数据');profiles=list.slice(0,20).map(normalize);activeId=parsed.activeId&&profiles.some(p=>p.id===parsed.activeId)?parsed.activeId:profiles[0].id;save();renderProfiles();renderEditor();renderList();toast(`已导入 ${profiles.length} 个账号`)}catch(e){toast('导入失败：'+e.message)}}
const ownQuery=(q,id)=>q.eq('id',id).eq(localIdentity?'owner_id':'user_id',owner)
async function publish(){if(!sb||!owner)return toast('云端暂不可用，本地进度已自动保存');if(!active())return toast('活动已结束');const p=current(),s=state(p);if(!p.nickname||!p.gameId||!p.server)return toast('请完整填写游戏昵称、ID和服务器');if(!s.missing.length)return toast('当前无需换入，无需发布');if(!s.surplus.length&&!confirm('当前没有可安全换出的字，仍要发布求助状态吗？'))return;const row={game_id:p.gameId,game_nickname:p.nickname,game_server:p.server,want_card:JSON.stringify(s.missing),want_rarity:TYPE,offer_cards:JSON.stringify(s.surplus.map(card=>({card,count:p.counts[card]-s.required[card]}))),remark:`剩余线路进度 ${s.progress}% · 已兑换 ${p.redeemedLines.length}/9 · 缺少：${s.missingText} · ${p.name}`,owner_id:owner,created_at:Date.now()};if(!localIdentity)row.user_id=owner;const old=posts.find(x=>x.isOwn&&x.game_id===p.gameId&&x.game_nickname===p.nickname&&x.game_server===p.server),q=old?ownQuery(sb.from('trade_posts').update(row),old.id):sb.from('trade_posts').insert(row),{error}=await q;if(error)return toast(error.code==='23505'?'该服务器、昵称和ID已存在有效状态':'发布失败：'+error.message);toast(old?'状态已更新':'发布成功');load()}
window.copyId=id=>navigator.clipboard?.writeText(id).then(()=>toast('游戏ID已复制'));window.completePost=async id=>{const{error}=await ownQuery(sb.from('trade_posts').update({completed_at:Date.now()}),id);if(error)return toast(error.message);load()};window.removePost=async id=>{if(!confirm('确认删除这条状态？'))return;const{error}=await ownQuery(sb.from('trade_posts').delete(),id);if(error)return toast(error.message);load()};window.reportPost=async id=>{if(await HW.report(sb,'trade',id)){posts=posts.filter(x=>String(x.id)!==String(id));renderList()}}
async function init(){try{profiles=JSON.parse(localStorage.getItem(STORE))||[]}catch(e){}profiles=profiles.map(normalize);if(!profiles.length)profiles=[normalize({name:'账号 1'})];activeId=localStorage.getItem(STORE+'_active')||profiles[0].id;if(!profiles.some(p=>p.id===activeId))activeId=profiles[0].id;save();$('phrase').innerHTML=WORDS.map(w=>`<i>${w}</i>`).join('');renderProfiles();renderEditor();renderList();updateDeadline();setInterval(updateDeadline,60000);$('publish').onclick=publish;$('search').oninput=renderList;if(!sb||!window.HW){$('stats').textContent='本地编辑可用 · 云端广场连接失败，请稍后刷新';return}try{const identity=await HW.ensureAuth(sb);owner=identity.id;localIdentity=!!identity.isLocalIdentity;await load();sb.channel('word_trade_status_changes').on('postgres_changes',{event:'*',schema:'public',table:'trade_posts',filter:`want_rarity=eq.${TYPE}`},load).subscribe()}catch(e){console.error(e);$('stats').textContent='本地编辑可用 · 云端广场暂不可用'}}
init()
